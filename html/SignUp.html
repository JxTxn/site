import "./SignUp.css";
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyBook</title>
    <link rel="stylesheet" href="css/SignUp.css">
</head>

<body>
    <div id="maintitlebox">
        <p id="maintitle">MyBook</p>
        <a href="Login.html" id="mainbutton">Log in</a>
    </div>
    <div id="reset"></div>
</body>
<div id="mainContainer">
        <div id="mainBox">
            <div id="title">
                <p class="text">Sign up in to Mybook</p>
            </div>
            <div>
                <form id="email" action="SignUp.html" method="post">
                <input type="email" name="email" id="emailInput" placeholder="Enter your email">
            </div>
            <div>
                <input id="password" name="password" id="passwordInput" placeholder="Enter your password">
            </div>
            <div id="loginButton">
                <p class="text">Sign up</p>
            </div>
        </div>
    </div>
</html>
